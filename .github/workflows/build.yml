name: Ruijie BE68U Build
on:
  workflow_dispatch:
  push:
    branches: ["mt798x-mt799x-mtwifi_be72pro_be68u"]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison openssl libssl-dev device-tree-compiler libz-dev libelf-dev python3 python3-pip unzip curl

      - name: Add iStore feed
        run: |
          echo 'src-git istore https://github.com/linkease/istore;main' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Config BE68U
        run: |
          make defconfig
          echo "CONFIG_TARGET_mediatek_mt798x_DEVICE_ruijie_be68u=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-opkg=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-compat=y" >> .config
          # 中文初始化向导quickstart
          echo "CONFIG_PACKAGE_luci-app-quickstart=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-quickstart-zh-cn=y" >> .config
          # iStoreX大屏主页
          echo "CONFIG_PACKAGE_luci-app-store=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-store-zh-cn=y" >> .config
          # AdGuardHome广告拦截
          echo "CONFIG_PACKAGE_luci-app-adguardhome=y" >> .config
          echo "CONFIG_PACKAGE_adguardhome=y" >> .config
          # Passwall 带中文
          echo "CONFIG_PACKAGE_luci-app-passwall=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y" >> .config
          # 定时重启
          echo "CONFIG_PACKAGE_luci-app-rebootschedule=y" >> .config
          # 网络唤醒WOL
          echo "CONFIG_PACKAGE_luci-app-wol=y" >> .config
          # 工具包
          echo "CONFIG_PACKAGE_iperf3=y" >> .config
          echo "CONFIG_PACKAGE_curl=y" >> .config
          echo "CONFIG_PACKAGE_wget=y" >> .config
          echo "CONFIG_PACKAGE_nano=y" >> .config
          # 新增插件
          echo "CONFIG_PACKAGE_luci-app-socat=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ddns=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-upnp=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-turboacc=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-netdata=y" >> .config

      - name: Compile firmware
        run: make -j$(nproc)

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: BE68U-Firmware
          path: bin/targets/**



